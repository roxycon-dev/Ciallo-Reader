gradle.projectsEvaluated {
    def app = rootProject.project(':app')
    app.tasks.matching { it.name in ['kspDebugUnitTestKotlin', 'compileDebugUnitTestJavaWithJavac','kspDebugAndroidTestKotlin'] }.configureEach { enabled = false }
    app.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        maxParallelForks = 1
        filter {
            includeTestsMatching('com.example.download.*Test')
            includeTestsMatching('com.example.data.AppDatabaseMigrationTest')
            includeTestsMatching('com.example.data.BackendImportSafetyTest')
            includeTestsMatching('com.example.library.NovelDownloadPanelTest')
            includeTestsMatching('com.example.library.ImageBytesTest')
            includeTestsMatching('com.example.library.ComicLocalImporterTest')
            includeTestsMatching('com.example.source.impl.*Test')
            includeTestsMatching('com.example.source.js.JsSourcePayloadTest')
        }
        jvmArgs('--add-exports=java.base/sun.nio.ch=ALL-UNNAMED','--add-opens=java.base/sun.nio.ch=ALL-UNNAMED')
    }
}
