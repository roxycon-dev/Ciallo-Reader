gradle.projectsEvaluated {
    def app = rootProject.project(':app')
    app.tasks.matching { it.name in ['kspDebugUnitTestKotlin', 'compileDebugUnitTestJavaWithJavac', 'kspDebugAndroidTestKotlin'] }.configureEach { enabled = false }
    app.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        maxParallelForks = 1
        filter {
            includeTestsMatching('com.example.ui.components.PaperMotionTimingTest')
            includeTestsMatching('com.example.ui.components.PaperAndSliderTest')
            includeTestsMatching('com.example.ui.components.MotionQualityTest')
        }
        systemProperty('paper.motion.record', System.getenv('PAPER_MOTION_RECORD') ?: 'false')
        systemProperty('paper.motion.variant', System.getenv('PAPER_MOTION_VARIANT') ?: 'optimized')
        jvmArgs('--add-exports=java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED')
    }
}
