name: Publish landing page

on:
  push:
    branches:
      - main
    paths:
      - "docs/promo-site/**"
      - ".github/workflows/pages.yml"
      - "tools/promo-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/promo-site/package-lock.json
      - name: Install build tools
        run: npm ci --prefix tools/promo-site
      - name: Build versioned static assets
        run: node tools/promo-site/build.mjs --out-dir "$RUNNER_TEMP/ciallo-reader-site"
      - name: Check asset links and JavaScript budget
        run: node tools/promo-site/check.mjs --out-dir "$RUNNER_TEMP/ciallo-reader-site"
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ciallo-reader-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
